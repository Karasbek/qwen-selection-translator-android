org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 has built-in Kotlin by default. This MVP explicitly uses the regular
# Kotlin Android plugin because it also applies the matching Compose compiler plugin.
android.builtInKotlin=false
# Keep the existing external Kotlin plugin on AGP's compatible legacy DSL.
android.newDsl=false
